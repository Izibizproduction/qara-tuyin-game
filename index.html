<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==========  ПОБЕГ ОТ ЖЕЗ КЕМПИР  ==========
   Тёмная зимняя палитра. Вертикальный телефонный макет,
   на десктопе — рамка с телефонными пропорциями по центру. */
/* Палитра взята из брендбука фильма (JK_bloggers_prompt_for_claude_design.md).
   Красный #AB0000 — официальный цвет релиза, он основной акцент.
   Золото по брендбуку редкое: оставлено только для очков. */
:root{
  --ink:#E2E9F2; --dim:#6F7983; --gold:#E8B84B;
  --blood:#AB0000; --blood-hot:#C0392B; --danger:#AB0000;
  --surface:#070F17; --raised:#212630; --hairline:#2A313C;
  --cell:52px; --gap:4px; --shake:0px; --dread:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070a}
body{
  font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
img{display:block;-webkit-user-drag:none}
img,#board,.actor{image-rendering:pixelated;image-rendering:crisp-edges}

#app{
  position:fixed;inset:0;margin:auto;width:100%;height:100%;
  background:linear-gradient(180deg,#050406 0%,#070F17 55%,#050406 100%);
  overflow:hidden;
}
/* на десктопе — телефонная рамка по центру, а не полоса во всю высоту окна */
@media (min-width:520px){
  body{background:radial-gradient(ellipse at 50% -10%,#111a25 0%,#05070a 70%)}
  #app{
    width:min(480px,56vh);height:min(100vh,calc(min(480px,56vh) * 1.85));
    border-radius:24px;
    box-shadow:0 0 0 1px #1d2836,0 0 0 9px #0b1119,0 26px 70px rgba(0,0,0,.85);
  }
}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:12px 14px max(16px,env(safe-area-inset-bottom))}
.screen.active{display:flex}

/* ---------- лого и дата: всегда рядом с содержимым, а не по краям ---------- */
.logo{width:min(72%,290px);height:auto;filter:drop-shadow(0 3px 10px rgba(0,0,0,.7))}
.logo.small{width:min(56%,215px)}
.reldate{width:min(64%,255px);height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}

/* ---------- загрузка ---------- */
#scr-load{justify-content:center;gap:18px}
.loadbox{width:100%;max-width:260px;text-align:center}
.loadbar{height:5px;background:#1e2836;border-radius:5px;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:var(--blood-hot);transition:width .15s}
.loadpct{margin-top:9px;font-size:11px;letter-spacing:.2em;color:var(--dim)}

/* ---------- меню: единый блок по центру ---------- */
#scr-menu{justify-content:center;padding-top:34px}
.tagline{text-align:center;margin:10px 0 12px}
.tagline b{
  display:block;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--danger);
  text-shadow:0 0 18px rgba(192,57,43,.45)
}
.tagline i{
  display:block;margin-top:6px;font-style:normal;font-size:11px;line-height:1.5;color:var(--dim)
}
.tagline i em{font-style:normal;color:var(--blood-hot)}

.picker{display:flex;gap:12px;width:100%;justify-content:center;flex:0 1 auto;min-height:0;height:min(32vh,236px);margin-top:10px}
.pick{
  flex:1 1 0;max-width:165px;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(19,27,38,.85);border:2px solid #22303f;border-radius:14px;
  padding:8px 6px;color:var(--dim);font:inherit;
  transition:border-color .15s,color .15s,background .15s;
}
.pick.selected{border-color:var(--blood-hot);color:var(--blood-hot);background:rgba(171,0,0,.10)}
.pick-name{flex:0 0 auto;font-size:13px;letter-spacing:.18em}
.pick-art{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;justify-content:center;width:100%}
.pick-art img{height:100%;width:100%;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}

button,a{touch-action:manipulation}
/* Антиква в капсе — как на официальном ассете даты и на постере */
.verdict,.score-big,.prize b,.sheet-head,.city h4,.age,#toast,.btn-main{
  font-family:"Cormorant Garamond","PT Serif",Georgia,serif;
}
.btn-main{
  flex:0 0 auto;margin-top:14px;width:100%;max-width:290px;padding:13px 0;
  border:0;border-radius:12px;background:var(--blood);color:#fff;
  font:inherit;font-size:16px;font-weight:700;letter-spacing:.20em;box-shadow:0 6px 0 #6b0000;
}
.btn-main:active{transform:translateY(3px);box-shadow:0 3px 0 #7d2519}
#scr-menu .reldate{margin-top:16px}

/* ---------- игра ---------- */
#scr-game{padding:0}
#hud{
  flex:0 0 auto;width:100%;height:44px;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:0 8px;
  background:rgba(5,7,10,.78);border-bottom:1px solid #1b2634;z-index:6;
}
.hud-btn{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:9px;
  background:rgba(255,255,255,.07);color:var(--ink);font-size:15px;line-height:1}
.hud-btn:active{background:rgba(255,255,255,.16)}
.hud-btn.off{opacity:.4}
#hud-level{font-size:12px;letter-spacing:.22em;color:var(--dim)}

#stage{
  position:relative;flex:1 1 auto;width:100%;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:8px;                 /* padding, а не margin — без схлопывания */
  overflow:hidden;transform:translate(var(--shake),0);
}
#stage-bg{position:absolute;inset:0;z-index:0;background-position:center top;
  background-size:cover;background-repeat:no-repeat}
#stage-shade{position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(5,8,14,.40) 0%,rgba(5,8,14,.55) 38%,rgba(5,8,14,.74) 100%)}
#road-zone{position:relative;flex:1 1 auto;width:100%;min-height:92px;z-index:2;padding:8px 10px}
.logo-play{width:min(50%,185px);height:auto;opacity:.95;
  filter:drop-shadow(0 2px 7px rgba(0,0,0,.95))}

#board{
  position:relative;z-index:3;display:grid;
  gap:var(--gap);padding:var(--gap);
  background:rgba(6,10,16,.42);border:1px solid rgba(171,0,0,.20);border-radius:12px;
  box-shadow:inset 0 10px 30px rgba(0,0,0,.55);
}
.cell{position:relative;width:var(--cell);height:var(--cell);border-radius:8px;
  background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.cell.next{background:rgba(226,233,242,.035)}
.cell.empty{background:rgba(0,0,0,.30);box-shadow:inset 0 0 0 1px rgba(226,233,242,.07)}
/* коридор, по которому ребёнок уже может пройти */
.cell.empty.path{background:rgba(171,0,0,.20);
  box-shadow:inset 0 0 0 1px rgba(171,0,0,.42),inset 0 0 12px rgba(171,0,0,.14)}
.cell.door{background:rgba(171,0,0,.12);box-shadow:inset 0 0 0 1px rgba(171,0,0,.5)}
.cell.entry{background:rgba(192,57,43,.10);box-shadow:inset 0 0 0 1px rgba(192,57,43,.45)}
/* пара, которую надо поменять местами: подсвечены ОБЕ клетки */
.cell.hint{animation:hintpulse 1s ease-in-out infinite;z-index:2}
.cell.hint::after{
  content:'';position:absolute;inset:-3px;border-radius:10px;pointer-events:none;
  border:2px solid rgba(171,0,0,.9)
}
@keyframes hintpulse{
  0%,100%{transform:scale(1);filter:brightness(1)}
  50%{transform:scale(1.08);filter:brightness(1.35)}
}
.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.cell.pop img{animation:pop .18s ease-in forwards}
/* блок на пути ребёнка осыпается после каждой сборки */
.cell.crumble img{animation:crumble .2s ease-in forwards}
.cell.crumble{box-shadow:inset 0 0 0 2px rgba(171,0,0,.8),0 0 16px rgba(171,0,0,.4)}
@keyframes crumble{
  0%{transform:translate(0,0) scale(1);filter:brightness(2.2)}
  30%{transform:translate(-3px,1px) scale(1.05)}
  60%{transform:translate(3px,2px) scale(.85);opacity:.7}
  100%{transform:translate(0,10px) scale(.4) rotate(-12deg);opacity:0}
}
.cell.bad{animation:shake .22s}
@keyframes pop{to{transform:scale(.15) rotate(18deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

#actors{position:absolute;inset:0;z-index:4;pointer-events:none}
.actor{position:absolute;left:0;top:0;background-repeat:no-repeat;transform-origin:50% 100%;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));will-change:transform}
#witch{filter:drop-shadow(0 0 10px rgba(192,57,43,.55)) drop-shadow(0 4px 6px rgba(0,0,0,.8))}

#danger{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:var(--dread);
  background:radial-gradient(ellipse at 50% 55%,rgba(192,57,43,0) 32%,rgba(192,57,43,.55) 100%);
  transition:opacity .15s linear}

#game-foot{flex:0 0 auto;width:100%;display:flex;justify-content:center;align-items:center;
  padding:6px 0 max(4px,env(safe-area-inset-bottom));background:rgba(5,7,10,.55)}
.reldate-foot{width:min(50%,192px);height:auto;opacity:.95;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}

#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:9;
  pointer-events:none;opacity:0;font-size:24px;font-weight:700;letter-spacing:.14em;
  color:var(--blood-hot);text-shadow:0 3px 0 #000,0 0 22px rgba(171,0,0,.6);text-align:center}
#toast.show{animation:toast 1.15s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}

/* ---------- скример ---------- */
#scr-catch{padding:0;background:#000;justify-content:center}
/* object-position держит глаза в кадре: cover обрезает по высоте */
#catch-face{width:100%;height:100%;object-fit:cover;object-position:center 28%;
  animation:scare 1.15s steps(1,end) forwards}
/* резкий рубленый монтаж: чёрное — кадр — чёрное — кадр, потом медленный наезд */
/* translateY держит лицо в центре: на арте оно выше середины кадра */
@keyframes scare{
  0%  {opacity:0;transform:scale(1.18) translateY(6%)}
  4%  {opacity:1;transform:scale(1.18) translateY(6%);filter:contrast(1.45) brightness(1.25)}
  9%  {opacity:0}
  13% {opacity:1;transform:scale(1.22) translate(-9px,6%);filter:contrast(1.3)}
  18% {opacity:0}
  22% {opacity:1;transform:scale(1.25) translate(8px,6%);filter:contrast(1.18)}
  30% {transform:scale(1.28) translate(-6px,6%)}
  40% {transform:scale(1.31) translate(5px,6%)}
  55% {transform:scale(1.35) translate(-4px,6%)}
  100%{opacity:1;transform:scale(1.46) translateY(6%);filter:contrast(1.05) brightness(.74)}
}
#catch-vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 34%,rgba(0,0,0,.8) 100%)}

/* ---------- результат ---------- */
#scr-over{justify-content:center}
.verdict{flex:0 0 auto;margin-top:8px;font-size:13px;letter-spacing:.16em;color:var(--danger)}
.verdict.win{color:var(--blood-hot)}
.score-block{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;margin-top:8px}
.stat-level{font-size:11px;letter-spacing:.20em;color:var(--dim)}
.stat-level b{color:var(--ink);font-size:15px}
.score-big{margin-top:2px;font-size:clamp(42px,14vw,64px);font-weight:700;line-height:1;
  color:var(--gold);text-shadow:0 4px 0 #000,0 0 26px rgba(232,184,75,.35)}
.score-cap{font-size:10px;letter-spacing:.34em;color:var(--dim);margin-top:3px}
.stat-row{display:flex;gap:28px;margin-top:10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px}
.stat span{font-size:19px;color:var(--ink)}
.stat i{font-style:normal;font-size:9px;letter-spacing:.18em;color:var(--dim)}
/* приз — главный смысл экрана: через него разыгрываются билеты */
.prize{
  flex:0 0 auto;margin-top:14px;width:100%;max-width:320px;text-align:center;
  padding:11px 12px 12px;border-radius:14px;
  border:1px solid rgba(171,0,0,.45);
  background:linear-gradient(180deg,rgba(171,0,0,.14),rgba(171,0,0,.04));
}
.prize b{display:block;font-size:13px;line-height:1.35;letter-spacing:.10em;color:var(--blood-hot);
  text-shadow:0 0 18px rgba(171,0,0,.35)}
.prize i{display:block;margin-top:5px;font-style:normal;font-size:10px;line-height:1.4;color:var(--dim)}

.share-row{flex:0 0 auto;display:flex;gap:7px;margin-top:10px;width:100%;max-width:330px}
.btn-share{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:8px 2px;border:1px solid #263446;border-radius:11px;
  background:rgba(19,27,38,.9);color:var(--ink);font:inherit;font-size:17px}
.btn-share:active{background:rgba(171,0,0,.15);border-color:var(--blood-hot)}
.btn-share i{font-style:normal;font-size:10.5px;line-height:1.2;letter-spacing:.05em;
  color:var(--dim);text-align:center}
#scr-over .btn-main{margin-top:10px;font-size:15px;padding:13px 0}
.btn-prize{
  background:linear-gradient(180deg,#C0392B,#AB0000);
  box-shadow:0 6px 0 #6b0000,0 0 26px rgba(216,69,47,.35);
  animation:prizepulse 2.4s ease-in-out infinite;
}
@keyframes prizepulse{
  0%,100%{box-shadow:0 6px 0 #6b0000,0 0 22px rgba(216,69,47,.30)}
  50%{box-shadow:0 6px 0 #6b0000,0 0 34px rgba(171,0,0,.45)}
}
#scr-over .reldate{margin-top:4px;width:min(52%,200px)}

/* ---------- снег ---------- */
#snow{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;opacity:.7;
  animation:fall linear infinite}
@keyframes fall{0%{transform:translate3d(0,-14px,0);opacity:0}10%{opacity:.75}
  100%{transform:translate3d(var(--dx),108vh,0);opacity:.15}}


/* ---------- выбор языка ---------- */
.langbar{position:absolute;top:10px;right:12px;display:flex;gap:4px;z-index:8}
.lang{
  padding:4px 8px;border:1px solid #26364a;border-radius:8px;
  background:rgba(19,27,38,.85);color:var(--dim);font:inherit;font-size:10px;letter-spacing:.08em;
}
.lang.on{border-color:var(--blood-hot);color:var(--blood-hot);background:rgba(171,0,0,.12)}

/* ---------- логлайн и отсчёт ---------- */
.countdown{
  flex:0 0 auto;margin:10px 0 2px;font-size:11px;letter-spacing:.18em;color:var(--danger);
  text-shadow:0 0 16px rgba(192,57,43,.45)
}
.countdown.big{font-size:13px;margin:2px 0 14px}
.logline{
  flex:0 0 auto;margin:9px 2px 0;max-width:340px;text-align:center;
  font-size:11px;line-height:1.5;color:#a9b8c9
}
.howto{
  flex:0 0 auto;margin:9px 0 0;max-width:320px;text-align:center;
  font-size:10.5px;line-height:1.45;color:var(--dim)
}

/* ---------- кнопки «о фильме» ---------- */
.filmrow{flex:0 0 auto;display:flex;gap:7px;margin-top:11px;width:100%;max-width:330px}
.bigrow{flex:0 0 auto;display:flex;gap:9px;margin-top:9px;width:100%;max-width:330px}
.btn-film{
  flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 4px;border:1px solid #2b3c52;border-radius:11px;
  background:rgba(19,27,38,.9);color:var(--ink);font:inherit;font-size:13px;
}
.btn-film span{font-size:10px;letter-spacing:.10em;color:var(--dim)}
.btn-film:active{background:rgba(171,0,0,.14);border-color:var(--blood-hot)}
.btn-film.big{padding:13px 4px;font-size:17px;border-color:#3a4b62}
.btn-film.big span{font-size:11.5px;letter-spacing:.14em;color:var(--ink)}

.rescode{margin-top:5px;font-size:11px;letter-spacing:.16em;color:var(--dim);opacity:.9;
  font-family:"Consolas","DejaVu Sans Mono",monospace}
.record{margin-top:8px;font-size:10.5px;letter-spacing:.10em;color:var(--dim)}
.record.new{color:var(--gold)}
.btn-share.accent{border-color:rgba(171,0,0,.5);background:rgba(171,0,0,.10)}
.btn-share.accent i{color:var(--blood-hot)}

/* ---------- выезжающие экраны: розыгрыш и билеты ---------- */
.screen.sheet{padding:0;justify-content:flex-start}
.sheet-head{
  flex:0 0 auto;width:100%;height:48px;display:flex;align-items:center;gap:6px;
  padding:0 10px;background:rgba(5,7,10,.9);border-bottom:1px solid #1b2634;
  font-size:12px;letter-spacing:.20em;color:var(--blood-hot)
}
.back{
  width:34px;height:34px;flex:0 0 auto;border:0;border-radius:9px;
  background:rgba(255,255,255,.07);color:var(--ink);font:inherit;font-size:22px;line-height:1
}
.sheet-body{
  flex:1 1 auto;width:100%;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 16px 24px;display:flex;flex-direction:column;align-items:center
}
.steps{list-style:none;width:100%;max-width:330px;margin:14px 0 4px}
.steps li{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}
.steps b{
  flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  background:var(--blood);color:#fff;font-size:12px;line-height:22px;text-align:center
}
.steps span{font-size:12px;line-height:1.45;color:var(--ink)}
.rules{
  margin-top:14px;max-width:330px;text-align:center;
  font-size:10.5px;line-height:1.55;color:var(--dim)
}
.btn-ghost{
  background:transparent;border:1px solid var(--blood-hot);color:var(--blood-hot);
  box-shadow:none;margin-top:9px
}
.btn-ghost:active{background:rgba(171,0,0,.14);box-shadow:none;transform:translateY(2px)}
#scr-contest .btn-main,#scr-tickets .btn-main{width:100%;max-width:330px}

.country{width:100%;max-width:340px}
.country h3{font-size:11px;letter-spacing:.26em;color:var(--dim);
  margin:6px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--hairline)}
.city{width:100%;max-width:340px;margin-bottom:16px}
.city h4{font-size:13px;letter-spacing:.16em;color:var(--blood-hot);margin-bottom:7px}
.cin{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px;margin-bottom:6px;border-radius:10px;
  background:rgba(19,27,38,.85);border:1px solid #22303f;
  font-size:12.5px;color:var(--dim);text-decoration:none
}
.cin span{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cin.online{color:var(--ink);border-color:#2b3c52}
.cin.online:active{border-color:var(--blood);background:rgba(28,38,52,.95)}
.cin i{font-style:normal;color:var(--blood-hot)}
.cin .tag{
  font-weight:400;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--hairline);border-radius:20px;padding:1px 6px
}

.age{
  flex:0 0 auto;margin-top:8px;padding:2px 9px;border-radius:20px;
  border:1px solid var(--hairline);color:var(--dim);
  font-size:12px;letter-spacing:.08em
}
.pick-age{flex:0 0 auto;font-size:10px;letter-spacing:.12em;color:var(--dim);margin-top:-2px}
/* язык — крупно и словами, а не кодами */
.langbar{position:absolute;top:10px;right:12px;left:12px;display:flex;gap:6px;z-index:8}
.lang{
  flex:1 1 0;padding:8px 0;border:1px solid var(--hairline);border-radius:10px;
  background:rgba(7,15,23,.85);color:var(--dim);
  font:inherit;font-size:11px;letter-spacing:.14em
}
.lang.on{border-color:var(--blood);color:#fff;background:rgba(171,0,0,.18)}
#scr-menu{padding-top:52px}
#sharecv{display:none}

@media (max-height:680px){
  .logo{width:min(68%,265px)}
  .reldate{width:min(54%,210px)}
  .tagline i{display:none}
  .picker{height:min(26vh,190px)}
  #over-hero{max-height:18vh}
}

/* Сложность: в начале ведьма идёт медленно и подходит долго,
   с каждым уровнем подход короче, а погоня быстрее. */
function cfg(lv) {
  return {
    types: Math.min(6, 4 + Math.floor((lv - 1) / 3)),   // новый тип раз в 3 уровня
    approach: Math.max(4.5, 12.5 - 0.42 * (lv - 1)),    // сек до входа в дом
    /* С 15-го уровня погоня догоняет скорость ребёнка (116), с 18-го
       обгоняет — отсюда естественный потолок в 17-20 уровней. Без него
       рекорд недели превращался в соревнование по усидчивости. */
    hunt: Math.min(134, 56 + 4.4 * (lv - 1))

/* ---------- поле: построение и отрисовка ---------- */
function buildBoardDOM() {
  boardEl.innerHTML = ''; cellEls = [];
  boardEl.style.gridTemplateColumns = 'repeat(' + COLS + ',var(--cell))';
  boardEl.style.gridTemplateRows = 'repeat(' + ROWS + ',var(--cell))';
  for (var r = 0; r < ROWS; r++) {
    cellEls[r] = [];
    for (var c = 0; c < COLS; c++) {
      var d = document.createElement('div');
      d.className = 'cell'; d.dataset.r = r; d.dataset.c = c;
      d.appendChild(document.createElement('img'));
      boardEl.appendChild(d); cellEls[r][c] = d;
    }
  }
}
function inb(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

function genBoard(types) {
  board = [];
  var r, c, t, i;
  for (r = 0; r < ROWS; r++) { board[r] = []; for (c = 0; c < COLS; c++) board[r][c] = 0; }
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
    if (r === DOOR.r && c === DOOR.c) { board[r][c] = DOOR_TILE; continue; }
    /* стартовая комната 2x2 у входа: ребёнку сразу есть куда шагнуть
       и есть где уворачиваться, когда ведьма войдёт в дом */
    if (r <= ENTRY.r + 1 && c <= ENTRY.c + 1) { board[r][c] = null; continue; }
    var pool = [];
    for (t = 0; t < types; t++) {
      var h2 = isItem(board[r][c - 1]) && board[r][c - 1] === t &&
               isItem(board[r][c - 2]) && board[r][c - 2] === t;
      var v2 = r >= 2 && board[r - 1][c] === t && board[r - 2][c] === t;
      if (!h2 && !v2) pool.push(t);
    }
    if (!pool.length) pool.push(Math.floor(Math.random() * types));
    board[r][c] = pool[Math.floor(Math.random() * pool.length)];
  }

  ensureProgress(true);
}

function render() {
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    var el = cellEls[r][c], v = board[r][c], im = el.firstChild, cls = 'cell';
    if (v === DOOR_TILE) {
      cls += ' door'; if (im.getAttribute('src') !== SRC.door) im.src = SRC.door;
      im.style.display = '';
    } else if (v === null) {
      cls += (r === ENTRY.r && c === ENTRY.c) ? ' entry' : ' empty';
      im.style.display = 'none';
    } else {
      var s = SRC[ITEMS[v]];
      if (im.getAttribute('src') !== s) im.src = s;
      im.style.display = '';
    }
    el.className = cls;
  }
  markPath();
  hintCells = null;                 /* классы стёрлись — подсказку покажем заново */
}

/* Подсвечиваем коридор, по которому ребёнок реально может пройти,
   и предметы вплотную к нему — сразу видно, где рубить дальше. */

  var d = distMap({ r: child.r, c: child.c }, null), key, p, r, c, i;
  for (key in d) {
    p = key.split(','); r = +p[0]; c = +p[1];
    if (board[r][c] !== null) continue;
    cellEls[r][c].className += ' path';
  }
  for (key in d) {
    p = key.split(','); r = +p[0]; c = +p[1];
    for (i = 0; i < DIRS.length; i++) {
      var nr = r + DIRS[i][0], nc = c + DIRS[i][1];
      if (!inb(nr, nc) || !isItem(board[nr][nc])) continue;
      var e2 = cellEls[nr][nc];
      if (e2.className.indexOf(' next') < 0) e2.className += ' next';
    }
  }
}

/* ---------- совпадения ---------- */

      if (isItem(v) && v === board[r][c - 1]) run++;
      else {
        if (run >= 3 && isItem(board[r][c - 1])) for (k = c - run; k < c; k++) out.add(r + ',' + k);
        run = 1;
      }
    }
  }
  for (c = 0; c < COLS; c++) {
    run = 1;
    for (r = 1; r <= ROWS; r++) {
      v = r < ROWS ? board[r][c] : '#';
      if (isItem(v) && v === board[r - 1][c]) run++;
      else {
        if (run >= 3 && isItem(board[r - 1][c])) for (k = r - run; k < r; k++) out.add(k + ',' + c);

  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    if (!isItem(board[r][c])) continue;
    var dirs = [[0, 1], [1, 0]];
    for (var i = 0; i < 2; i++) {
      var r2 = r + dirs[i][0], c2 = c + dirs[i][1];

      swapCells(r, c, r2, c2);

/* Клетки с предметами, вплотную примыкающие к коридору ребёнка.
   Убрать любую из них — значит реально продвинуть ребёнка вперёд. */

  var reach = distMap({ r: child.r, c: child.c }, null), f = {}, key, i;
  for (key in reach) {
    var p = key.split(','), r = +p[0], c = +p[1];
    for (i = 0; i < DIRS.length; i++) {
      var nr = r + DIRS[i][0], nc = c + DIRS[i][1];
      if (inb(nr, nc) && isItem(board[nr][nc])) f[nr + ',' + nc] = 1;
    }
  }
  return f;
}

/* Ищем ход. Приоритет — «полезный»: тот, что убирает предмет вплотную к
   ребёнку. Именно его отсутствие рождало жалобу «передо мной нет вариантов».
   Возвращает {move:[r,c,r2,c2], useful:bool} или null. */
function findMove(needUseful) {
  var front = frontierSet(), any = null, r, c, i;
  var dirs = [[0, 1], [1, 0]];
  for (r = 0; r < ROWS; r++) for (c = 0; c < COLS; c++) {
    if (!isItem(board[r][c])) continue;
    for (i = 0; i < 2; i++) {
      var r2 = r + dirs[i][0], c2 = c + dirs[i][1];
      if (!inb(r2, c2) || !isItem(board[r2][c2])) continue;
      swapCells(r, c, r2, c2);
      var m = findMatches(), useful = false;
      m.forEach(function (k) { if (front[k]) useful = true; });
      swapCells(r, c, r2, c2);
      if (!m.size) continue;
      if (useful) return { move: [r, c, r2, c2], useful: true };
      if (!any) any = { move: [r, c, r2, c2], useful: false };
    }
  }
  return needUseful ? null : any;
}

/* Гарантия проходимости. После каждой сборки поле обязано удовлетворять двум
   условиям, иначе перемешиваем оставшиеся предметы:
     1) на поле нет готовых троек (иначе «три в ряд стоят, но не исчезают»);
     2) существует ход, открывающий проход ПЕРЕД РЕБЁНКОМ.

   чтобы сдвинуть ребёнка с места. */

     полезный ход бессмысленно: достаточно, чтобы поле было чистым
     и на нём оставался хоть какой-то ход. */

  var okNow = function () {
    return findMatches().size === 0 && (doorOpen ? !!findMove(false) : !!findMove(true));

  var cleanAnyMove = null;
  if (vals.length >= 3) {
    for (var t = 0; t < 900; t++) {
      for (i = vals.length - 1; i > 0; i--) {
        j = Math.floor(Math.random() * (i + 1));
        var tmp = vals[i]; vals[i] = vals[j]; vals[j] = tmp;
      }
      for (i = 0; i < pos.length; i++) board[pos[i][0]][pos[i][1]] = vals[i];
      if (findMatches().size) continue;              // грязная раскладка не годится
      if (okNow()) {
        render();
        if (!silent) { SFX.shuffle(); toast(tr('t_shuffle')); }
        return;
      }
      if (!cleanAnyMove && findMove(false)) cleanAnyMove = snapshot();
    }

     Убираем те, что подпирают ребёнка: проход открывается, поле не вычищаем. */

/* ---------- ход игрока ---------- */
function tryMove(r, c, dr, dc) {
  if (busy || state !== 'play') return;
  var r2 = r + dr, c2 = c + dc;
  if (!inb(r2, c2) || !isItem(board[r][c]) || !isItem(board[r2][c2])) return;
  busy = true;
  swapCells(r, c, r2, c2);
  if (findMatches().size === 0) {
    render();
    setTimeout(function () {
      swapCells(r, c, r2, c2); render();
      cellEls[r][c].classList.add('bad'); cellEls[r2][c2].classList.add('bad');
      SFX.bad();
      setTimeout(function () {
        cellEls[r][c].classList.remove('bad'); cellEls[r2][c2].classList.remove('bad');
        busy = false;
      }, 240);
    }, 110);
    return;
  }
  render();
  resolve().then(function () { busy = false; });
}

function resolve() {
  var combo = 0;
  function step() {
    var m = findMatches();
    if (!m.size) {
      ensureProgress(false);
      if (findMatches().size) return step();       /* подстраховка: чисто — значит чисто */
      child.nr = null; witch.nr = null;
      return Promise.resolve();
    }
    combo++; stats.clears++; stats.score += 100 * combo;
    resetHint();
    SFX.collect(combo);
    m.forEach(function (k) { var p = k.split(','); cellEls[+p[0]][+p[1]].classList.add('pop'); });
    return wait(190).then(function () {
      m.forEach(function (k) { var p = k.split(','); board[+p[0]][+p[1]] = null; });
      /* ГЛАВНОЕ ПРАВИЛО: любая сборка проламывает один блок на пути ребёнка.
         Благодаря этому игроку не нужно выцеливать конкретные предметы перед
         ребёнком — достаточно собирать где угодно, и он идёт дальше. */
      var pb = pathBlock();
      if (!pb) { finishStep(null); return wait(120); }
      cellEls[pb.r][pb.c].classList.add('crumble');
      SFX.crumble();
      return wait(200).then(function () { finishStep(pb); return wait(90); });
    }).then(step);

    function finishStep(pb) {
      if (pb) board[pb.r][pb.c] = null;
      render();
      child.nr = null;                              /* тропа стала шире — идём дальше */
      if (combo > 1) toast(tr('t_combo') + combo);
    }
  }
  return step();
}

/* ---------- ввод ---------- */
var touch = null;
function onDown(e) {
  startMusic();
  if (state !== 'play' || busy) return;
  var node = e.target.closest ? e.target.closest('.cell') : null;
  if (!node) return;
  var p = pointOf(e);
  touch = { r: +node.dataset.r, c: +node.dataset.c, x: p.x, y: p.y };
}
function onUp(e) {
  if (!touch) return;
  var p = pointOf(e), dx = p.x - touch.x, dy = p.y - touch.y, t = touch;
  touch = null;
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
  if (Math.abs(dx) > Math.abs(dy)) tryMove(t.r, t.c, 0, dx > 0 ? 1 : -1);
  else tryMove(t.r, t.c, dy > 0 ? 1 : -1, 0);
}
function pointOf(e) {
  var t = e.changedTouches ? e.changedTouches[0] : e;
  return { x: t.clientX, y: t.clientY };
}

/* ---------- геометрия: измеряем РЕАЛЬНУЮ позицию поля ---------- */
function layout() {
  var sw = stageEl.clientWidth, sh = stageEl.clientHeight, gap = 3;
  var byW = Math.floor((sw - 14 - (COLS + 1) * gap - 2) / COLS);
  var byH = Math.floor((sh - 104 - (ROWS + 1) * gap - 2) / ROWS);
  /* нижняя граница 40px — чтобы по предмету было удобно свайпать пальцем */
  var cell = clamp(Math.min(byW, byH), 40, 60);
  document.documentElement.style.setProperty('--cell', cell + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
  measure();
}
function measure() {
  var sr = stageEl.getBoundingClientRect();
  var a = cellEls[0][0].getBoundingClientRect(), b = cellEls[1][1].getBoundingClientRect();
  M.stageW = sr.width; M.stageH = sr.height; M.cell = a.width;
  M.step = (b.left - a.left) || a.width;
  M.ox = a.left - sr.left + a.width / 2;
  M.oy = a.top - sr.top + a.height / 2;
  M.boardY = boardEl.getBoundingClientRect().top - sr.top;
}

/* ---------- дорога-серпантин на заднике ---------- */
var road = { pts: [], seg: [], len: 1 };
function buildRoad() {
  var h = Math.max(60, M.boardY), W = M.stageW;
  var norm = [[0.50, -0.03], [0.17, 0.22], [0.83, 0.45], [0.24, 0.68], [0.66, 0.88]];
  var pts = norm.map(function (p) { return { x: p[0] * W, y: p[1] * h }; });
  pts.push(cellCenter(ENTRY.r, ENTRY.c));
  var seg = [], total = 0;
  for (var i = 1; i < pts.length; i++) {
    var d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    seg.push(d); total += d;
  }

  var d = clamp(t, 0, 1) * road.len, i = 0;
  while (i < road.seg.length && d > road.seg[i]) { d -= road.seg[i]; i++; }
  if (i >= road.seg.length) { var l = road.pts[road.pts.length - 1]; return { x: l.x, y: l.y }; }

/* ---------- пути ---------- */
/* Только четыре стороны. Диагонали делали путь вдвое короче — уровень
   заканчивался за три сборки, и ведьма не успевала создать напряжение.
   Связность коридора теперь обеспечивает не диагональ, а правило
   «сборка ломает блок на пути» (см. resolve). */

    for (var i = 0; i < DIRS.length; i++) {
      var nr = cur.r + DIRS[i][0], nc = cur.c + DIRS[i][1], key = nr + ',' + nc;
      if (!passable(nr, nc) || key in dist) continue;
      if (block && block[key]) continue;
      dist[key] = d0 + 1; q.push({ r: nr, c: nc });
    }

}

  if (from.r === goal.r && from.c === goal.c) return null;
  var dist = distMap(goal, block), here = dist[from.r + ',' + from.c];
  if (here === undefined) return null;
  var best = null, bestD = here;
  for (var i = 0; i < DIRS.length; i++) {

    if (!passable(nr, nc)) continue;
    var d = dist[nr + ',' + nc];
    if (d !== undefined && d < bestD) { bestD = d; best = { r: nr, c: nc }; }
  }

}

   по мере того, как открывается коридор, не дожидаясь полного пути. */

  var dist = distMap(from, block), best = from, bestScore = 1e9;
  for (var key in dist) {
    var p = key.split(','), r = +p[0], c = +p[1];
    var score = (Math.abs(r - goal.r) + Math.abs(c - goal.c)) * 100 + dist[key];
    if (score < bestScore) { bestScore = score; best = { r: r, c: c }; }
  }
  return best;

/* ===== ПОДСКАЗКА ==========================================================
   Ребёнок больше ничего не ломает сам — это читалось как магия. Вместо этого:
   если игрок какое-то время не собрал ни одной тройки, поле само показывает
   ПАРУ предметов, которые надо поменять местами. Подсвечиваются обе клетки —
   чтобы не возникало мысли «тащить надо вот этот один».
   Приоритет у хода, открывающего проход перед ребёнком.                     */

function clearHint() {
  if (!hintCells) return;
  hintCells.forEach(function (p) {
    if (cellEls[p[0]] && cellEls[p[0]][p[1]]) cellEls[p[0]][p[1]].classList.remove('hint');
  });
  hintCells = null;
}
function showHint() {
  clearHint();
  var f = findMove(true) || findMove(false);
  if (!f) return;
  var m = f.move;
  hintCells = [[m[0], m[1]], [m[2], m[3]]];
  hintCells.forEach(function (p) { cellEls[p[0]][p[1]].classList.add('hint'); });
  if (!hintShown) { hintShown = true; toast(tr('t_hint')); }
}
function updateHint(dt) {
  if (busy) return;

}
function resetHint() { hintT = 0; clearHint(); }

/* Первый предмет, стоящий на кратчайшем пути ребёнка к двери.
   Дейкстра по полю: пустая клетка стоит 0, клетка с предметом — 1. */

  for (r = 0; r < ROWS; r++) { dist[r] = []; for (c = 0; c < COLS; c++) dist[r][c] = INF; }

    var cur = q.splice(bi, 1)[0];

    for (i = 0; i < DIRS.length; i++) {

      var nd = dist[cur.r][cur.c] + (passable(nr, nc) ? 0 : 1);
      if (nd < dist[nr][nc]) { dist[nr][nc] = nd; prev[nr + ',' + nc] = cur; q.push({ r: nr, c: nc }); }
    }

  var path = [], node = { r: DOOR.r, c: DOOR.c };

/* ---------- цикл ---------- */
/* Пока ведьма в доме, она наливается силой: сначала RUSH_GRACE секунд
   идёт как обычно (это время нужно нормальному игроку, чтобы доиграть
   уровень), а потом разгоняется и тянется всё дальше. Так наказывается
   только стояние на месте, а не игра. */

var HUNT_RUSH = 0.075, HUNT_RUSH_MAX = 2.6;   // дальше +7.5%/сек, потолок x2.6

}
function frame(ts) {
  var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0;
  last = ts;
  if (state !== 'play') return;

  var C = cfg(level), px = M.cell / 56;

  if (witch.phase === 'road') {
    wt += dt / C.approach;
    var p = roadAt(wt);
    if (p.x - witch.x < -0.3) witch.face = -1; else if (p.x - witch.x > 0.3) witch.face = 1;
    witch.x = p.x; witch.y = p.y; witch.moving = true;
    if (wt >= 1) {
      witch.phase = 'hunt'; witch.huntT = 0;
      witch.r = ENTRY.r; witch.c = ENTRY.c; witch.nr = null;
      var e = cellCenter(ENTRY.r, ENTRY.c); witch.x = e.x; witch.y = e.y;

  } else {
    /* Пока ведьма в доме, она разгоняется. Уворачиваться можно,
       но не бесконечно — иначе пассивная игра ничем не наказывалась. */

    var over = Math.max(0, witch.huntT - RUSH_GRACE);
    witch.rush = Math.min(HUNT_RUSH_MAX, 1 + over * HUNT_RUSH);

  [child, witch].forEach(function (a) {
    if (a.moving) { a.ft += dt; if (a.ft > 0.085) { a.ft = 0; a.frame++; } } else a.frame = 0;

  drawActor(childEl, child, SPR[hero], 1.55);
  drawActor(witchEl, witch, SPR.witch, 1.72);

  var dist = Math.hypot(witch.x - child.x, witch.y - child.y);
  var dread = witch.phase === 'hunt' ? clamp(1 - dist / (M.cell * 4), 0, 1) : 0;
  document.documentElement.style.setProperty('--dread', (dread * 0.85).toFixed(3));
  shakeT += dt * 40;
  document.documentElement.style.setProperty('--shake',
    (Math.sin(shakeT) * dread * 3.5).toFixed(2) + 'px');

  var reach = M.cell * (0.5 + REACH_GROW * ((witch.rush || 1) - 1));
  if (witch.phase === 'hunt' && dist < reach) { onCaught(); return; }
  if (child.r === DOOR.r && child.c === DOOR.c && child.nr === null) onEscaped();
}

      Array.prototype.forEach.call(document.querySelectorAll('.pick'),
        function (x) { x.classList.remove('selected'); });
      b.classList.add('selected'); hero = b.dataset.hero; loadCaught(hero);
    });
  });
  $('#btn-run').addEventListener('click', startRun);
  $('#btn-again').addEventListener('click', function () { show('scr-menu'); state = 'menu'; });
  $('#btn-close').addEventListener('click', function () {
    if (state === 'play' || state === 'pause') endRun('quit');
  });
  $('#btn-sound').addEventListener('click', function () {
    muted = !muted;
    this.classList.toggle('off', muted);
    this.innerHTML = muted ? ICON_MUTE : ICON_SOUND;
    if (muted) { musicOn = false; music.pause(); } else startMusic();
  });

  /* --- экраны, открывающиеся поверх результата --- */
  var prevScreen = 'scr-over';
  function openSheet(id) {
    prevScreen = document.querySelector('#scr-menu.active') ? 'scr-menu' : 'scr-over';
    show(id);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function (b) {
    b.addEventListener('click', function () { show(prevScreen); });
  });

  function openTrailer() {
    if (TG && TG.openLink) TG.openLink(TRAILER_URL); else window.open(TRAILER_URL, '_blank');
  }
  $('#m-trailer').addEventListener('click', openTrailer);
  $('#o-trailer').addEventListener('click', openTrailer);
  $('#m-tickets').addEventListener('click', function () { openSheet('scr-tickets'); });
  $('#o-tickets').addEventListener('click', function () { openSheet('scr-tickets'); });
  $('#m-insta').addEventListener('click', function () { openInstagram(false); });
  $('#btn-insta').addEventListener('click', function () { openInstagram(false); });
  $('#btn-contest').addEventListener('click', function () { openSheet('scr-contest'); });
  $('#c-save').addEventListener('click', saveResult);
  $('#c-insta').addEventListener('click', function () { openInstagram(true); });

  /* --- выбор языка --- */
  Array.prototype.forEach.call(document.querySelectorAll('.lang'), function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });
  $('#btn-tg').addEventListener('click', function () {
    var link = 'https://t.me/share/url?url=' + encodeURIComponent(GAME_URL) +
      '&text=' + encodeURIComponent(shareText());
    if (TG && TG.openTelegramLink) TG.openTelegramLink(link);
    else window.open(link, '_blank');
  });
  $('#btn-copy').addEventListener('click', function () {
    var txt = shareText(), self = this, lab = self.querySelector('i'), was = lab.innerHTML;
    function done() { lab.innerHTML = 'СКОПИРОВАНО'; setTimeout(function () { lab.innerHTML = was; }, 1500); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(done, fallback);
    else fallback();
  });

  function onResize() {
    if (!cellEls.length) return;
    layout();
    if (state === 'play' || state === 'pause') {
      buildRoad();
      var cc = cellCenter(child.r, child.c); child.x = cc.x; child.y = cc.y; child.nr = null;
      if (witch.phase === 'hunt') {
        var wc = cellCenter(witch.r, witch.c); witch.x = wc.x; witch.y = wc.y; witch.nr = null;
      }
    }
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 250); });
  if (TG && TG.onEvent) { try { TG.onEvent('viewportChanged', onResize); } catch (e) {} }

  requestAnimationFrame(loop);
  setInterval(watchdog, 33);

  preload(function (p) {
    $('#loadfill').style.width = Math.round(p * 100) + '%';
    $('#loadpct').textContent = Math.round(p * 100) + '%';
  }).then(function () {
    state = 'menu'; setLang(detectLang()); show('scr-menu');
    /* всё тяжёлое, что не нужно в первую секунду, догружаем фоном */
    $('#catch-face').src = SCARE_SRC;
    loadCaught(hero);
    loadStills();
    music.preload = 'auto';
    try { music.load(); } catch (e) {}
  });
}

/* Тестовая поверхность. Включается только адресом ?dev=1 и отдаёт КОПИИ:
   счёт и уровень изменить отсюда нельзя — они остаются внутри замыкания,
   иначе результат конкурса подделывался бы одной строкой в консоли. */
if (/[?&]dev=1(&|$)/.test(location.search)) {
  window.__JK = {
    get board() { return board.map(function (r) { return r.slice(); }); },
    get stats() { return JSON.parse(JSON.stringify(stats)); },
    get M() { return JSON.parse(JSON.stringify(M)); },
    get child() { return JSON.parse(JSON.stringify(child)); },
    get witch() { return JSON.parse(JSON.stringify(witch)); },
    get state() { return state; }, get level() { return level; },
    get busy() { return busy; }, get hintT() { return hintT; },
    findMatches: findMatches, findMove: findMove, tryMove: tryMove,
    resultCode: resultCode, buildShareImage: buildShareImage,
    step: function (dtSec) { last = performance.now() - dtSec * 1000; frame(performance.now()); }
  };
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
</body>
</html>
